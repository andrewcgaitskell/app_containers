# Zigbee2MQTT configuration.yaml
# Mount this into the container at: /app/data/configuration.yaml
# e.g. docker run -v /path/to/this/dir:/app/data ...

# MQTT broker settings — point at your Mosquitto instance
mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://localhost:1883      # broker on localhost only, anonymous access

# Zigbee adapter — path as seen INSIDE the container.
# Map the USB device through in your docker run/compose, e.g.:
#   --device=/dev/serial/by-id/<your-adapter-id>:/dev/ttyACM0
serial:
  port: /dev/ttyACM0
  adapter: zstack                    # change to 'ember', 'deconz', 'zigate' etc. to match your dongle

# Enable the built-in frontend (web UI) — bound to localhost only
frontend:
  port: 8080
  host: 127.0.0.1

# Home Assistant MQTT discovery — required for devices to appear automatically in HA
homeassistant:
  enabled: true

# Let zigbee2mqtt generate a network key and pan ID on first run
advanced:
  network_key: GENERATE
  pan_id: GENERATE
  ext_pan_id: GENERATE
  log_level: info
  # last_seen: ISO_8601            # uncomment if you want human-readable last_seen timestamps
  # cache_state: true              # default true — retains state across restarts

# Allow new devices to join the network.
# Set to false once your network is stable to prevent unauthorised joins.
permit_join: false
