services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - /opt/data/home_assistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host

  health:
    build:
      context: ../health
      dockerfile: Dockerfile
    container_name: health
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/data/health:/var/log

  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome:2026.9.0
    command: dashboard --host 127.0.0.1 /config
    volumes:
      - /opt/data/esphome/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /dev:/dev
    restart: always
    privileged: true
    network_mode: host
    environment:
      - USERNAME=${ESPHOME_USERNAME}
      - PASSWORD=${ESPHOME_PASSWORD}

  mosquitto:
    build:
      context: ../mosquitto
    hostname: mosquitto
    container_name: mosquitto
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/data/mosquitto/data:/mosquitto/data
      - /opt/data/mosquitto/log:/mosquitto/log

  
  zigbee2mqtt:
    container_name: zigbee2mqtt
    build:
      context: ../zigbee2mqtt
      dockerfile: Dockerfile
    volumes:
      - /opt/data/zigbee2mqtt_data:/app/data
      - /run/udev:/run/udev:ro
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/London
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    security_opt:
      - no-new-privileges:true

  otbr:
    container_name: otbr
    image: openthread/border-router:latest
    network_mode: host        # OTBR needs the host's network stack directly
    cap_add:
      - NET_ADMIN              # required for interface/routing configuration
    devices:
      - /dev/ttyUSB1:/dev/ttyUSB1   # RCP serial device — adjust if yours differs
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /opt/data/otbr/data:/data
    environment:
      OT_RCP_DEVICE: "spinel+hdlc+uart:///dev/ttyUSB1?uart-baudrate=460800"
      OT_INFRA_IF: "wlan0"      # set to eth0 if that's your infra interface
      OT_THREAD_IF: "wpan0"
      OT_LOG_LEVEL: "7"
    restart: always


  matter-server:
    image: ghcr.io/matter-js/matterjs-server:stable
    container_name: matter-server
    depends_on:
      otbr:
        condition: service_started
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/London
      - NOBLE_BINDINGS=dbus
      - BLUETOOTH_ADAPTER=0
      - LISTEN_ADDRESS=127.0.0.1
    volumes:
      - /opt/data/matter/data:/data/
      - /run/dbus:/run/dbus:ro

  postgres:
    build:
      context: ../postgres
      dockerfile: Dockerfile
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    network_mode: host
    volumes:
      - /opt/data/app_containers/postgres/quart:/app
      - /opt/data/postgres_data/data:/var/lib/postgresql
      - /opt/data/app_containers/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - /opt/data/postgres_data/logs:/logs
      - /opt/data/postgres_data/backups:/backups

  quart_app:
    build:
      context: ../quart_app
      dockerfile: Dockerfile
    container_name: quart_app
    depends_on:
      - postgres
      - mosquitto
    environment:
      MQTT_BROKER: localhost
      MQTT_PORT: 1883
      POSTGRES_HOST: localhost
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      HASS_TOKEN: ${HASS_TOKEN}
      HASS_URL: ${HASS_URL}
      MQTT_TOPIC: "#"  # subscribe to all topics
    volumes:
      - /opt/data/app_containers/quart_app:/app
    network_mode: host

  blockly:
    build:
      context: ../blockly
      dockerfile: Dockerfile
    container_name: blockly
    depends_on:
      - postgres
      - mosquitto
    environment:
      MQTT_BROKER: localhost
      MQTT_PORT: 1883
      POSTGRES_HOST: localhost
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MQTT_TOPIC: "#"  # subscribe to all topics
    network_mode: host
    volumes:
      - /opt/data/blockly:/usr/share/nginx/html
      - /opt/data/blockly/programs:/data/programs

  jupyter:
    build:
      context: ../jupyter
      dockerfile: Dockerfile
    container_name: jupyter
    network_mode: host
    volumes:
      - /opt/data/jupyter:/opt/data
    working_dir: /opt/data
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
    restart: unless-stopped

  cloudbeaver:
    image: dbeaver/cloudbeaver:${CLOUDBEAVER_TAG:-latest}
    container_name: cloudbeaver
    restart: unless-stopped
  
    ports:
      - "127.0.0.1:8978:8978"
  
    environment:
      - TZ=${CB_TZ:-Etc/UTC}
      - CB_SERVER_NAME=${CB_SERVER_NAME:-CloudBeaver}
      - CB_ADMIN_NAME=${CB_ADMIN_NAME:-}
      - CB_ADMIN_PASSWORD=${CB_ADMIN_PASSWORD:-}
  
    volumes:
      - /opt/data/cloudbeaver_workspace:/opt/cloudbeaver/workspace
