services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - /opt/data/home_assistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host

  health:
    build:
      context: ../health
      dockerfile: Dockerfile
    container_name: health
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/data/health:/var/log

  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    volumes:
      - /opt/data/esphome/config:/config
      - /etc/localtime:/etc/localtime:ro
    restart: always
    privileged: true
    network_mode: host
    environment:
      - USERNAME=${ESPHOME_USERNAME}
      - PASSWORD=${ESPHOME_PASSWORD}

  mosquitto:
    build:
      context: ../mosquitto
    hostname: mosquitto
    container_name: mosquitto
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/data/mosquitto/data:/mosquitto/data
      - /opt/data/mosquitto/log:/mosquitto/log

  
  zigbee2mqtt:
    container_name: zigbee2mqtt
    build:
      context: ../zigbee2mqtt
      dockerfile: Dockerfile
    volumes:
      - /opt/data/zigbee2mqtt_data:/app/data
      - /run/udev:/run/udev:ro
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/London
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    security_opt:
      - no-new-privileges:true

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    security_opt:
      - apparmor:unconfined
    volumes:
      - /opt/data/matter/data:/data/
      - /run/dbus:/run/dbus:ro

  postgres:
    build:
      context: ../postgres
      dockerfile: Dockerfile
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    network_mode: host
    volumes:
      - /opt/data/app_containers/postgres/quart:/app
      - /opt/data/postgres_data/data:/var/lib/postgresql
      - /opt/data/postgres_data/logs:/logs
      - /opt/data/postgres_data/backups:/backups

  quart_app:
    build:
      context: ../quart_app
      dockerfile: Dockerfile
    container_name: quart_app
    depends_on:
      - postgres
      - mosquitto
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      HASS_TOKEN: ${HASS_TOKEN}
      HASS_URL: ${HASS_URL}
      MQTT_TOPIC: "#"  # subscribe to all topics
    volumes:
      - /opt/data/app_containers/quart_app:/app
    network_mode: host

  blockly:
    build:
      context: ../blockly
      dockerfile: Dockerfile
    container_name: blockly
    depends_on:
      - postgres
      - mosquitto
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MQTT_TOPIC: "#"  # subscribe to all topics
    network_mode: host

  jupyter:
    build:
      context: ../jupyter
      dockerfile: Dockerfile
    # ensure an arm64 image is used/pulled/built on arm64 hosts
    platform: linux/arm64
    user: "root"
    network_mode: host
    volumes:
      # host /opt/data -> container workdir (keeps workdir away from home dirs)
      - /opt/data:/opt/data
    working_dir: /opt/data
    restart: unless-stopped

  cloudbeaver:
    build:
      context: ../cloudbeaver
      dockerfile: Dockerfile
    container_name: cloudbeaver
    restart: unless-stopped
  
    network_mode: host
  
    environment:
      - TZ=${CB_TZ:-Etc/UTC}
      - CB_SERVER_NAME=${CB_SERVER_NAME:-CloudBeaver}
      - CB_ADMIN_NAME=${CB_ADMIN_NAME:-}
      - CB_ADMIN_PASSWORD=${CB_ADMIN_PASSWORD:-}
  
    volumes:
      - /opt/data/dbeaver:/opt/cloudbeaver/workspace
